<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMC Quiz — Gold Trading</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--panel:#0d1525;--border:#1e2d45;
  --green:#00e5a0;--red:#ff4d6d;--yellow:#ffd166;--blue:#4ea8ff;
  --t1:#f0f6ff;--t2:#b8d0ea;--tm:#7a9aba;--inp:#0f1a2e;
}
body{background:var(--bg);color:var(--t1);font-family:'Courier New',monospace;min-height:100vh}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

#header{background:#0b1120;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
#header h1{font-size:20px;font-weight:800;color:var(--green);letter-spacing:1px}
#header p{font-size:10px;color:var(--tm);letter-spacing:2px;margin-top:3px}
#stats-bar{display:flex;gap:20px;flex-wrap:wrap}
.stat-box{text-align:center}
.stat-val{font-size:17px;font-weight:700}
.stat-lbl{font-size:9px;color:var(--tm);letter-spacing:1px}

#tabs{display:flex;background:#0b1120;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:11px 22px;font-size:11px;font-family:inherit;background:transparent;color:var(--tm);border:none;border-bottom:2px solid transparent;cursor:pointer;letter-spacing:1px;transition:all .2s;white-space:nowrap}
.tab.active{background:var(--bg);color:var(--green);border-bottom:2px solid var(--green)}

#sync-bar{background:#080d18;border-bottom:1px solid var(--border);padding:8px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync-label{font-size:9px;color:var(--tm);letter-spacing:2px;white-space:nowrap}
.sync-btn{padding:6px 14px;border-radius:3px;font-size:10px;font-family:inherit;cursor:pointer;letter-spacing:1px;font-weight:700;transition:all .2s;white-space:nowrap}
.sync-export{background:transparent;border:1px solid var(--green);color:var(--green)}
.sync-export:hover{background:#00e5a015}
.sync-import{background:transparent;border:1px solid var(--blue);color:var(--blue)}
.sync-import:hover{background:#4ea8ff15}
.sync-reset{background:transparent;border:1px solid var(--border);color:var(--tm)}
.sync-reset:hover{border-color:var(--red);color:var(--red)}
.sync-status{font-size:10px;color:var(--tm);margin-left:auto;letter-spacing:1px}
#import-file{display:none}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#0d1525;border:1px solid var(--green);color:var(--green);padding:10px 22px;border-radius:6px;font-size:12px;font-family:'Courier New',monospace;letter-spacing:1px;opacity:0;transition:all .35s;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#content{padding:20px;max-width:820px;margin:0 auto}

/* Progress bar */
.prog-wrap{margin-bottom:18px}
.prog-bar-bg{background:var(--border);border-radius:2px;height:4px}
.prog-bar-fill{height:4px;border-radius:2px;background:var(--green);transition:width .4s}
.prog-info{display:flex;justify-content:space-between;font-size:10px;color:var(--tm);letter-spacing:1px;margin-top:5px}

/* Section filter */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.ftag{padding:5px 12px;border:1px solid var(--border);border-radius:3px;font-size:10px;font-family:inherit;background:transparent;color:var(--tm);cursor:pointer;letter-spacing:1px;transition:all .2s}
.ftag.active{border-color:var(--green);color:var(--green);background:#00e5a010}

/* Question card */
.q-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
.q-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-tag{padding:3px 9px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:1px}
.q-num{font-size:10px;color:var(--tm);letter-spacing:1px}
.q-status{font-size:10px;letter-spacing:1px;margin-left:auto}
.q-text{font-size:14px;color:var(--t1);line-height:1.7;margin-bottom:14px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{padding:11px 14px;border:1px solid var(--border);border-radius:6px;background:var(--inp);color:var(--t2);font-size:13px;font-family:inherit;cursor:pointer;text-align:left;line-height:1.5;transition:all .2s;display:flex;align-items:flex-start;gap:10px}
.opt:hover:not(:disabled){border-color:var(--tm);color:var(--t1)}
.opt-key{font-weight:700;flex-shrink:0;margin-top:1px}
.opt.correct{border-color:var(--green);background:#00e5a012;color:var(--green)}
.opt.wrong{border-color:var(--red);background:#ff4d6d10;color:var(--red)}
.opt.reveal-ans{border-color:var(--green);background:#00e5a012;color:var(--green)}
.opt:disabled{cursor:default}
.exp-box{margin-top:12px;background:#0a0e1a;border-left:3px solid var(--green);padding:11px 14px;border-radius:0 6px 6px 0;font-size:12px;color:var(--tm);line-height:1.7}
.exp-box b{color:var(--yellow)}
.q-footer{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.btn-peek{padding:7px 14px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--tm);font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:1px;transition:all .2s}
.btn-peek:hover{border-color:var(--yellow);color:var(--yellow)}
.answered-tag{font-size:10px;letter-spacing:1px;padding:4px 10px;border-radius:3px}

/* Score pane */
.score-hero{text-align:center;padding:30px 0 20px}
.score-big{font-size:64px;font-weight:800;color:var(--green);line-height:1}
.score-sub{font-size:12px;color:var(--tm);letter-spacing:2px;margin-top:6px}
.grade-pill{display:inline-block;margin:14px 0 0;padding:7px 22px;border-radius:4px;font-size:13px;font-weight:700;letter-spacing:1px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.scard{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.scard-val{font-size:20px;font-weight:700}
.scard-lbl{font-size:9px;color:var(--t2);letter-spacing:1px;margin-top:4px}
.sec-breakdown{margin-top:18px}
.sec-title{font-size:10px;color:var(--tm);letter-spacing:2px;margin-bottom:10px}
.sec-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:11px}
.sec-name{width:170px;flex-shrink:0;color:var(--t2)}
.sec-bar-bg{flex:1;height:5px;border-radius:2px;background:var(--border)}
.sec-bar-fill{height:5px;border-radius:2px;transition:width .5s}
.sec-score{width:44px;text-align:right;flex-shrink:0;color:var(--tm)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn-main{padding:11px 24px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .2s}
.btn-green{background:var(--green);border:none;color:#0a0e1a}
.btn-green:hover{background:#00c988}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--t2)}
.btn-outline:hover{border-color:var(--tm);color:var(--t1)}

/* Review pane */
.filter-btns{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.fbtn{padding:6px 14px;border:1px solid var(--border);border-radius:3px;font-family:inherit;font-size:10px;background:transparent;color:var(--tm);cursor:pointer;letter-spacing:1px}
.fbtn.active{background:var(--green);border-color:var(--green);color:#0a0e1a;font-weight:700}
.rv-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.rv-q{font-size:13px;color:var(--t1);font-weight:700;margin-bottom:8px;line-height:1.6}
.rv-row{font-size:11px;color:var(--tm);margin-bottom:4px;line-height:1.6}
.rv-row span{font-weight:700}
.rv-exp{font-size:11px;color:var(--tm);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.7}

.empty{text-align:center;color:var(--tm);padding:60px 0;font-size:13px;letter-spacing:1px}
.save-note{text-align:center;font-size:10px;color:var(--border);letter-spacing:1px;margin-top:20px;padding-bottom:10px}

@media(max-width:520px){
  .cards3{grid-template-columns:repeat(3,1fr)}
  .scard-val{font-size:16px}
  .q-text{font-size:13px}
  .opt{font-size:12px}
  .sec-name{width:120px}
  #content{padding:12px}
}
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>SMC QUIZ</h1>
    <p>SMART MONEY CONCEPT — GOLD TRADING</p>
  </div>
  <div id="stats-bar">
    <div class="stat-box"><div class="stat-val" id="s-score" style="color:var(--green)">0%</div><div class="stat-lbl">SCORE</div></div>
    <div class="stat-box"><div class="stat-val" id="s-done" style="color:var(--yellow)">0</div><div class="stat-lbl">ANSWERED</div></div>
    <div class="stat-box"><div class="stat-val" id="s-correct" style="color:var(--green)">0</div><div class="stat-lbl">CORRECT</div></div>
    <div class="stat-box"><div class="stat-val" id="s-wrong" style="color:var(--red)">0</div><div class="stat-lbl">WRONG</div></div>
  </div>
</div>

<div id="tabs">
  <button class="tab active" onclick="switchTab('quiz')">📝 ทำข้อสอบ</button>
  <button class="tab" onclick="switchTab('score')">📊 สรุปคะแนน</button>
  <button class="tab" onclick="switchTab('review')">🔍 ทบทวน</button>
</div>

<div id="sync-bar">
  <span class="sync-label">SYNC</span>
  <button class="sync-btn sync-export" onclick="exportProgress()">⬇ EXPORT JSON</button>
  <button class="sync-btn sync-import" onclick="document.getElementById('import-file').click()">⬆ IMPORT JSON</button>
  <input type="file" id="import-file" accept=".json" onchange="importProgress(event)"/>
  <button class="sync-btn sync-reset" onclick="resetAll()">✕ รีเซ็ต</button>
  <span class="sync-status" id="sync-status">—</span>
</div>

<div id="toast"></div>

<div id="content">
  <div id="pane-quiz"></div>
  <div id="pane-score" style="display:none"></div>
  <div id="pane-review" style="display:none"></div>
</div>

<script>
const SAVE_KEY = "smc_quiz_v4";
const G = "#00e5a0", R = "#ff4d6d", Y = "#ffd166", B = "#4ea8ff", TM = "#7a9aba";

const SEC_COLORS = {
  "Market Structure":"#00e5a0","Order Blocks":"#4ea8ff","Fair Value Gap":"#ffd166",
  "Liquidity":"#ff4d6d","Premium & Discount":"#c084fc","Sessions & Timing":"#fb923c",
  "Entry & RR":"#34d399","Multi-Timeframe":"#7a9aba",
  "Psychology & Mindset":"#f472b6","Gold Knowledge":"#facc15"
};

const QUESTIONS = [
  {id:1,section:"Market Structure",q:"ใน SMC การที่ราคาทำ Higher High (HH) และ Higher Low (HL) ต่อเนื่องกัน หมายความว่าอย่างไร?",
   opts:["Bearish Market Structure — แนวโน้มขาลง","Bullish Market Structure — แนวโน้มขาขึ้น","Sideways Market — ราคาแกว่งไม่มีทิศทาง","Market Structure Break กำลังเกิดขึ้น"],
   ans:1,exp:"เมื่อราคาทำ HH และ HL ต่อเนื่อง หมายความว่าตลาดอยู่ในแนวโน้มขาขึ้น (Bullish Market Structure) Smart Money กำลัง accumulate ทองคำอยู่"},
  {id:2,section:"Market Structure",q:"Market Structure Break (MSB) หรือ Break of Structure (BOS) คืออะไร?",
   opts:["ราคาทดสอบแนวรับแนวต้านเดิม","ราคาทำลาย Swing High/Low สำคัญ ส่งสัญญาณเปลี่ยนแนวโน้ม","Volume เพิ่มขึ้นผิดปกติ","Gap เกิดขึ้นบนกราฟ"],
   ans:1,exp:"BOS เกิดเมื่อราคาทะลุ Swing High (bearish→bullish) หรือ Swing Low (bullish→bearish) Smart Money เปลี่ยนทิศทางแล้ว"},
  {id:3,section:"Market Structure",q:"Change of Character (CHoCH) ใน SMC แตกต่างจาก BOS อย่างไร?",
   opts:["CHoCH เกิดก่อน BOS เป็นสัญญาณเตือนแรกของการเปลี่ยนทิศ","BOS เกิดก่อนเสมอ","ทั้งสองเกิดพร้อมกัน","ไม่มีความแตกต่าง ใช้แทนกันได้"],
   ans:0,exp:"CHoCH คือสัญญาณแรกที่บอกว่าโครงสร้างตลาดอาจเปลี่ยน มักเป็นการทะลุ minor swing ในขณะที่ BOS คือการทะลุ Swing Low/High สำคัญ"},
  {id:4,section:"Order Blocks",q:"Order Block (OB) ใน SMC คืออะไร?",
   opts:["แท่งเทียนสีแดง/เขียวขนาดใหญ่ที่ปิดแรง","กลุ่มแท่งเทียนสุดท้ายก่อนที่ราคาจะ impulse move อย่างรุนแรง","พื้นที่ที่มี Volume สูงผิดปกติ","ช่องว่างระหว่างสองแท่งเทียน"],
   ans:1,exp:"Order Block คือแท่งเทียนสุดท้ายก่อน impulse move Smart Money วาง order ขนาดใหญ่ไว้ที่นี่ เมื่อราคา retrace กลับมาจะเกิด reaction"},
  {id:5,section:"Order Blocks",q:"Bullish Order Block (Bullish OB) สำหรับทองคำ ควรมองหาจากแท่งเทียนประเภทใด?",
   opts:["แท่งเทียนสีแดง (Bearish) สุดท้ายก่อนราคาพุ่งขึ้นแรง","แท่งเทียนสีเขียว (Bullish) สุดท้ายก่อนราคาลงแรง","บริเวณที่ราคาแกว่งนานที่สุด","จุดที่ RSI Oversold"],
   ans:0,exp:"Bullish OB คือแท่งเทียน Bearish สุดท้าย (สีแดง) ก่อน impulse ขึ้น Smart Money ซื้อในแท่งนั้น เมื่อราคา retrace ถึงโซนนี้จะเป็น buying opportunity"},
  {id:6,section:"Order Blocks",q:"เมื่อราคาทองคำ retrace กลับมาหา Order Block ควรรอ confirmation แบบใดก่อน entry?",
   opts:["รอให้ราคาทะลุผ่าน OB ไปก่อนแล้วค่อย entry","รอ rejection candle, engulfing หรือ CHoCH ใน lower timeframe","ใช้ MACD cross เป็น signal","เปิด order ทันทีที่ราคาแตะขอบ OB"],
   ans:1,exp:"การรอ confirmation เช่น rejection candle, Engulfing, หรือ CHoCH ใน LTF ลด false signal อย่างมาก เพิ่ม probability การค้าที่สำเร็จ"},
  {id:7,section:"Fair Value Gap",q:"Fair Value Gap (FVG) หรือ Imbalance ใน SMC เกิดจากอะไร?",
   opts:["ราคาเคลื่อนไหวช้าและ consolidate นาน","ราคาเคลื่อนไหวเร็วเกินไปจนมี Gap ระหว่าง High/Low ของแท่งก่อน-หลัง","Volume ลดลงอย่างกะทันหัน","News สำคัญกำลังจะออก"],
   ans:1,exp:"FVG เกิดเมื่อราคาเคลื่อนที่เร็วมาก ทำให้ Low ของแท่งที่ 3 สูงกว่า High ของแท่งที่ 1 (Bullish FVG) ตลาดมักกลับมา fill ช่องว่างนี้"},
  {id:8,section:"Fair Value Gap",q:"Bullish FVG ในแนวโน้มขาขึ้น เราควรทำอะไรเมื่อราคา retrace กลับเข้ามา?",
   opts:["Sell เมื่อราคา retrace กลับเข้า FVG","Buy เมื่อราคา retrace กลับเข้ามาใน FVG Zone","รอจนราคาปิดทะลุ FVG ก่อน","ไม่ trade เพราะ FVG คือ danger zone"],
   ans:1,exp:"Bullish FVG ในแนวโน้มขาขึ้นคือโซน Support ที่ Smart Money มักซื้อเพิ่ม เมื่อราคา pullback เข้ามาใน FVG คือโอกาส Buy ที่ดี"},
  {id:9,section:"Fair Value Gap",q:"Inverse FVG (iFVG) คืออะไร?",
   opts:["FVG ที่เกิดขึ้นในแนวโน้มขาลง","FVG ที่ถูก filled แล้วกลายเป็น zone ตรงข้าม (Bullish→Resistance, Bearish→Support)","FVG ที่เกิดจาก News","FVG ขนาดเล็กที่ไม่มีนัยสำคัญ"],
   ans:1,exp:"iFVG คือ FVG ที่ราคา fill เต็มแล้ว zone นั้นจะ flip เป็น zone ตรงข้าม Bullish FVG ที่ถูก fill ครบแล้วจะกลายเป็น Resistance zone"},
  {id:10,section:"Liquidity",q:"Liquidity ใน SMC คืออะไร และ Smart Money ต้องการมันเพื่ออะไร?",
   opts:["กระแสเงินในระบบธนาคาร ใช้กำหนดอัตราดอกเบี้ย","Cluster ของ Stop Loss orders ที่ Smart Money ต้องการเพื่อ fill order ขนาดใหญ่","ปริมาณการซื้อขายรายวัน","ช่องว่างระหว่าง Bid-Ask"],
   ans:1,exp:"Smart Money ต้องการ Liquidity เพื่อ fill order ขนาดใหญ่ Buy Stops อยู่เหนือ Swing High และ Sell Stops อยู่ใต้ Swing Low ราคามักวิ่งไปล่า Liquidity ก่อนกลับทิศ"},
  {id:11,section:"Liquidity",q:"'Stop Hunt' หรือ 'Liquidity Sweep' ในทองคำ คืออะไร?",
   opts:["ราคาทองคำหยุดวิ่งกะทันหัน","ราคาวิ่งทะลุ Swing High เพื่อ trigger Stop Loss ของ Short แล้วกลับทิศลงอย่างรวดเร็ว","ราคาแกว่งในช่วงแคบนานกว่า 2 วัน","Volume ต่ำกว่าค่าเฉลี่ย"],
   ans:1,exp:"Stop Hunt เกิดเมื่อราคาทะลุ Swing High/Low รวดเร็วเพื่อล่า Stop Loss แล้วกลับทิศทันที ในทองคำเกิดบ่อยช่วง London Open และ NY Open"},
  {id:12,section:"Liquidity",q:"Equal Highs (EQH) และ Equal Lows (EQL) มีนัยสำคัญอย่างไรใน SMC?",
   opts:["เป็นสัญญาณ Sideways ควรหลีกเลี่ยง","เป็นแหล่ง Liquidity ที่ Smart Money จะ grab ก่อนเปลี่ยนทิศ","บอกว่าตลาดมี Supply/Demand สมดุล","ใช้เป็นจุดตั้ง Take Profit เสมอ"],
   ans:1,exp:"EQH/EQL คือแหล่ง Liquidity ชั้นดี Retail traders มักวาง Stop ใต้ EQL หรือเหนือ EQH Smart Money จะ sweep ก่อนเคลื่อนที่ในทิศตรงข้าม"},
  {id:13,section:"Premium & Discount",q:"Premium Zone และ Discount Zone ใน SMC คืออะไร?",
   opts:["Premium = เหนือ 50% ของ Swing Range (แพง/ขาย), Discount = ใต้ 50% (ถูก/ซื้อ)","Premium = โซน spread สูง, Discount = โซน spread ต่ำ","Premium = Timeframe สูง, Discount = Timeframe ต่ำ","Premium = London session, Discount = Asian session"],
   ans:0,exp:"Premium Zone อยู่เหนือ 50% ของ swing range ล่าสุด (แพง เหมาะ Sell) ส่วน Discount Zone อยู่ใต้ 50% (ถูก เหมาะ Buy) ควรผสมกับ OB/FVG"},
  {id:14,section:"Premium & Discount",q:"ถ้า Gold วิ่งจาก 2000 ถึง 2100 จุด Equilibrium (50%) อยู่ที่ราคาเท่าไหร่?",
   opts:["2025","2050","2060","2075"],

const SECTIONS = [...new Set(QUESTIONS.map(q=>q.section))];

let state = {answers:{},revealed:{},filterSec:"ALL",reviewFilter:"all"};
try{ const s=localStorage.getItem(SAVE_KEY); if(s) state=JSON.parse(s); }catch(e){}

function save(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}
  updateSyncStatus();
}

function updateSyncStatus(){
  const done = Object.keys(state.answers).length + Object.keys(state.revealed).length;
  const el = document.getElementById("sync-status");
  if(el) el.textContent = done>0 ? `บันทึกแล้ว ${done} ข้อ · ${new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}` : "—";
}

function showToast(msg, color){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.borderColor = color||"#00e5a0";
  t.style.color = color||"#00e5a0";
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2800);
}

function exportProgress(){
  const done = Object.keys(state.answers).length;
  if(done===0){ showToast("ยังไม่มีข้อมูลที่จะ Export ครับ", "#ffd166"); return; }
  const payload = { version:"smc_quiz_v3", exported: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `smc-quiz-progress-${dateStr}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast(`✓ Export สำเร็จ — ตอบแล้ว ${done} ข้อ`, "#00e5a0");
}

function importProgress(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const payload = JSON.parse(ev.target.result);
      if(!payload.state || !payload.version){ showToast("✗ ไฟล์ไม่ถูกต้องครับ", "#ff4d6d"); return; }
      const incoming = payload.state;
      const inDone = Object.keys(incoming.answers||{}).length;
      const curDone = Object.keys(state.answers||{}).length;
      if(curDone>0 && inDone<curDone){
        if(!confirm(`ข้อมูลปัจจุบัน: ${curDone} ข้อ\nไฟล์ที่ Import: ${inDone} ข้อ\n\nต้องการ Import ทับไหมครับ?`)){
          e.target.value=""; return;
        }
      }
      state = { answers:{}, revealed:{}, filterSec:"ALL", reviewFilter:"all", ...incoming };
      save(); updateHeader();
      const tab = document.querySelector(".tab.active");
      const cur = tab ? (tab.textContent.includes("สรุป")?"score":tab.textContent.includes("ทบทวน")?"review":"quiz") : "quiz";
      switchTab(cur);
      showToast(`✓ Import สำเร็จ — โหลดข้อมูล ${inDone} ข้อ`, "#00e5a0");
    } catch(err){ showToast("✗ อ่านไฟล์ไม่ได้ กรุณาตรวจสอบครับ", "#ff4d6d"); }
    e.target.value="";
  };
  reader.readAsText(file);
}

function resetAll(){
  if(!confirm("รีเซ็ตทั้งหมด? คำตอบและความคืบหน้าทั้งหมดจะหายไป")) return;
  state={answers:{},revealed:{},filterSec:"ALL",reviewFilter:"all"};
  save(); updateHeader(); switchTab("quiz");
  showToast("รีเซ็ตเรียบร้อยแล้วครับ", "#ffd166");
}

function updateHeader(){
  const done = Object.keys(state.answers).length;
  const correct = Object.values(state.answers).filter((v,i)=>{
    const qi = Object.keys(state.answers)[i];
    return state.answers[qi] === QUESTIONS.find(q=>q.id==qi)?.ans;
  }).length;
  // recount properly
  let c=0,w=0;
  QUESTIONS.forEach(q=>{
    if(state.answers[q.id]!==undefined){
      if(state.answers[q.id]===q.ans) c++;
      else w++;
    }
  });
  const total = c+w;
  document.getElementById("s-score").textContent = total>0 ? Math.round(c/total*100)+"%" : "0%";
  document.getElementById("s-done").textContent = total;
  document.getElementById("s-correct").textContent = c;
  document.getElementById("s-wrong").textContent = w;
}

function switchTab(t){
  ["quiz","score","review"].forEach(p=>{
    document.getElementById("pane-"+p).style.display = p===t?"block":"none";
  });
  document.querySelectorAll(".tab").forEach((el,i)=>{
    el.classList.toggle("active",["quiz","score","review"][i]===t);
  });
  if(t==="quiz") renderQuiz();
  if(t==="score") renderScore();
  if(t==="review") renderReview();
}

function renderQuiz(){
  const qs = state.filterSec==="ALL" ? QUESTIONS : QUESTIONS.filter(q=>q.section===state.filterSec);
  const answered = qs.filter(q=>state.answers[q.id]!==undefined||state.revealed[q.id]).length;
  const pct = qs.length>0 ? Math.round(answered/qs.length*100) : 0;

  let html = `<div class="prog-wrap">
    <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%"></div></div>
    <div class="prog-info"><span>PROGRESS ${answered}/${qs.length}</span><span>${pct}%</span></div>
  </div>`;

  html += `<div class="filter-row"><button class="ftag ${state.filterSec==='ALL'?'active':''}" onclick="setFilter('ALL')">ALL</button>`;
  SECTIONS.forEach(s=>{
    html += `<button class="ftag ${state.filterSec===s?'active':''}" style="${state.filterSec===s?'border-color:'+SEC_COLORS[s]+';color:'+SEC_COLORS[s]+';background:'+SEC_COLORS[s]+'15':''}" onclick="setFilter('${s.replace(/'/g,"\\'")}')">
      ${s.toUpperCase()}
    </button>`;
  });
  html += `</div>`;

  qs.forEach(q=>{
    const ua = state.answers[q.id];
    const rev = state.revealed[q.id];
    const isAnswered = ua!==undefined;
    const isCorrect = ua===q.ans;
    const sc = SEC_COLORS[q.section];

    let statusHtml="";
    if(isAnswered) statusHtml = isCorrect
      ? `<span class="q-status" style="color:var(--green)">✓ CORRECT</span>`
      : `<span class="q-status" style="color:var(--red)">✗ WRONG</span>`;
    else if(rev) statusHtml = `<span class="q-status" style="color:var(--yellow)">— PEEKED</span>`;

    html += `<div class="q-card" id="qc-${q.id}">
      <div class="q-meta">
        <span class="sec-tag" style="background:${sc}20;color:${sc}">${q.section.toUpperCase()}</span>
        <span class="q-num">Q${q.id} / ${QUESTIONS.length}</span>
        ${statusHtml}
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options">`;

    q.opts.forEach((opt,oi)=>{
      let cls="opt";
      if(isAnswered||rev){
        if(oi===q.ans) cls+=" reveal-ans";
        if(oi===ua && ua!==q.ans) cls+=" wrong";
      }
      const dis=(isAnswered||rev)?"disabled":"";
      html+=`<button class="${cls}" ${dis} onclick="answer(${q.id},${oi})">
        <span class="opt-key">${String.fromCharCode(65+oi)}.</span>
        <span>${opt}</span>
      </button>`;
    });

    html += `</div>`;
    if(isAnswered||rev){
      html+=`<div class="exp-box">💡 ${q.exp}</div>`;
    }
    if(!isAnswered&&!rev){
      html+=`<div class="q-footer"><button class="btn-peek" onclick="peek(${q.id})">ดูเฉลย ▸</button></div>`;
    }
    html+=`</div>`;
  });

  const allDone = QUESTIONS.filter(q=>state.answers[q.id]!==undefined).length===QUESTIONS.length;
  if(allDone){
    html+=`<div style="text-align:center;padding:16px 0 24px">
      <button class="btn-main btn-green" onclick="switchTab('score')">ดูสรุปคะแนน ▸</button>
    </div>`;
  }
  html+=`<div class="save-note">— บันทึกอัตโนมัติ ปิดแล้วกลับมาทำต่อได้ —</div>`;
  document.getElementById("pane-quiz").innerHTML=html;
}

function setFilter(s){
  state.filterSec=s; save(); renderQuiz();
}

function answer(qid,oi){
  state.answers[qid]=oi; save(); updateHeader(); renderQuiz();
  setTimeout(()=>{
    const el=document.getElementById("qc-"+qid);
    if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
  },100);
}

function peek(qid){
  state.revealed[qid]=true; save(); renderQuiz();
  setTimeout(()=>{
    const el=document.getElementById("qc-"+qid);
    if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
  },100);
}

function renderScore(){
  let correct=0,wrong=0,peeked=0;
  const secStats={};
  SECTIONS.forEach(s=>secStats[s]={c:0,t:0});
  QUESTIONS.forEach(q=>{
    secStats[q.section].t++;
    const ua=state.answers[q.id];
    if(ua!==undefined){
      if(ua===q.ans){correct++;secStats[q.section].c++;}
      else wrong++;
    } else if(state.revealed[q.id]) peeked++;
  });
  const total=correct+wrong;
  const pct=total>0?Math.round(correct/total*100):0;
  const allAnswered=QUESTIONS.filter(q=>state.answers[q.id]!==undefined).length;

  let grade,gcol,gbg;
  if(pct>=90){grade="MASTER — พร้อมเทรดจริงได้แล้ว";gcol=G;gbg="#00e5a020"}
  else if(pct>=75){grade="ADVANCED — ดีมาก ทบทวนจุดอ่อน";gcol=B;gbg="#4ea8ff20"}
  else if(pct>=60){grade="INTERMEDIATE — ผ่านได้ ต้องเพิ่มเติม";gcol=Y;gbg="#ffd16620"}
  else{grade="BEGINNER — ทบทวนใหม่ก่อนเทรดจริง";gcol=R;gbg="#ff4d6d20"}

  let html=`<div class="score-hero">
    <div class="score-big" style="color:${pct>=60?G:R}">${correct}<span style="font-size:28px;color:#7a9aba">/${QUESTIONS.length}</span></div>
    <div class="score-sub">ตอบแล้ว ${allAnswered} ข้อ · ถูก ${correct} · ผิด ${wrong} · ดูเฉลย ${peeked}</div>
    <div class="grade-pill" style="background:${gbg};color:${gcol}">${grade}</div>
  </div>
  <div class="cards3">
    <div class="scard"><div class="scard-val" style="color:${pct>=60?G:R}">${pct}%</div><div class="scard-lbl">SCORE</div></div>
    <div class="scard"><div class="scard-val" style="color:#00e5a0">${correct}</div><div class="scard-lbl">CORRECT</div></div>
    <div class="scard"><div class="scard-val" style="color:#ff4d6d">${wrong}</div><div class="scard-lbl">WRONG</div></div>
  </div>
  <div class="sec-breakdown">
    <div class="sec-title">SCORE BY SECTION</div>`;

  SECTIONS.forEach(s=>{
    const st=secStats[s];
    const sp=st.t>0?Math.round(st.c/st.t*100):0;
    const sc=SEC_COLORS[s];
    html+=`<div class="sec-row">
      <div class="sec-name" style="color:${sc}">${s}</div>
      <div class="sec-bar-bg"><div class="sec-bar-fill" style="width:${sp}%;background:${sc}"></div></div>
      <div class="sec-score">${st.c}/${st.t}</div>
    </div>`;
  });

  html+=`</div>
  <div class="btn-row">
    <button class="btn-main btn-green" onclick="switchTab('review')">ทบทวนคำตอบ ▸</button>
  </div>`;

  document.getElementById("pane-score").innerHTML=html;
}



function renderReview(){
  const f=state.reviewFilter||"all";
  let html=`<div class="filter-btns">
    <button class="fbtn ${f==='all'?'active':''}" onclick="setReviewFilter('all')">ALL</button>
    <button class="fbtn ${f==='wrong'?'active':''}" onclick="setReviewFilter('wrong')">WRONG ONLY</button>
    <button class="fbtn ${f==='correct'?'active':''}" onclick="setReviewFilter('correct')">CORRECT ONLY</button>
    <button class="fbtn ${f==='peeked'?'active':''}" onclick="setReviewFilter('peeked')">PEEKED</button>
  </div>`;

  let count=0;
  QUESTIONS.forEach(q=>{
    const ua=state.answers[q.id];
    const rev=state.revealed[q.id];
    const isCorrect=ua===q.ans;
    if(f==="wrong"&&(isCorrect||ua===undefined)) return;
    if(f==="correct"&&(!isCorrect||ua===undefined)) return;
    if(f==="peeked"&&!rev) return;
    count++;
    const sc=SEC_COLORS[q.section];
    let topbar="";
    if(ua!==undefined){
      topbar=isCorrect?"border-top:3px solid #00e5a0":"border-top:3px solid #ff4d6d";
    } else if(rev){
      topbar="border-top:3px solid #ffd166";
    }

    html+=`<div class="rv-card" style="${topbar}">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <span class="sec-tag" style="background:${sc}20;color:${sc}">${q.section.toUpperCase()}</span>
        <span style="font-size:10px;color:#7a9aba">Q${q.id}</span>
      </div>
      <div class="rv-q">${q.q}</div>`;

    if(ua!==undefined){
      html+=`<div class="rv-row">คุณตอบ: <span style="color:${isCorrect?G:R}">${String.fromCharCode(65+ua)}. ${q.opts[ua]}</span> ${isCorrect?"✓":"✗"}</div>`;
      if(!isCorrect) html+=`<div class="rv-row">เฉลย: <span style="color:#00e5a0">${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}</span></div>`;
    } else if(rev){
      html+=`<div class="rv-row" style="color:#ffd166">ดูเฉลยโดยไม่ตอบ — เฉลย: <span>${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}</span></div>`;
    }
    html+=`<div class="rv-exp">💡 ${q.exp}</div></div>`;
  });

  if(count===0) html+=`<div class="empty">ไม่มีข้อที่ตรงกับ filter นี้</div>`;
  document.getElementById("pane-review").innerHTML=html;
}

function setReviewFilter(f){
  state.reviewFilter=f; save(); renderReview();
}

updateHeader();
updateSyncStatus();
renderQuiz();
</script>
